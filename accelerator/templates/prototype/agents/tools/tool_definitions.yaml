# accelerator/templates/prototype/agents/tools/tool_definitions.yaml
#
# Function tool schemas registered with Azure AI Foundry as part of each
# PromptAgent's definition. The names here MUST match the keys referenced
# by `tools:` in every agents/<name>/agent.yaml AND the Python callables
# wired up in agents/tools/.
#
# Adding a new tool:
#   1. Append a new top-level entry below with `name`, `description`, and a
#      JSON Schema `parameters` object.
#   2. Implement the matching callable in agents/tools/<name>.py and
#      register it with the runtime FunctionInvocationLayer.
#   3. Reference the tool by name in any agent's agent.yaml `tools:` list.
#
# register_agents.py reads this file at runtime; no code changes are needed
# to surface a new tool to a registered agent.
#
# NOTE: "search_knowledge_base" is NOT defined here. It is special-cased in
# register_agents.py as a native MCP tool (knowledge_base_retrieve) against
# the Foundry IQ knowledge base connection created by
# infra/modules/foundry-search-connection.bicep -- not a FunctionTool, and
# not backed by a local Python callable. See RESOLVED.md for the migration
# from the old FunctionTool-based search_tool.py.

- name: run_sql_query
  description: >
    Execute a Cosmos DB SQL query against the prototype data containers. Use
    this whenever the user asks for live data from the system. Do NOT
    fabricate query results — always call this tool and use what it returns.
  strict: false
  parameters:
    type: object
    properties:
      query:
        type: string
        description: >
          Cosmos SQL. Always alias the container as 'c' in the FROM clause
          (e.g. "SELECT c.status FROM c WHERE c.status = 'open'") and pass
          the real container name separately via the `container` parameter
          below -- do NOT rely on this tool to guess the container from the
          FROM clause text.
      params:
        type: array
        description: 'Optional list of named parameters: [{"name": "@x", "value": ...}]'
        items:
          type: object
          properties:
            name: { type: string }
            value: {}
          required: [name, value]
      container:
        type: string
        description: >
          REQUIRED. The exact container name to query (e.g. "clients",
          "risk_assessments"). Must always be supplied -- the query's FROM
          clause should use the alias 'c', not the container name, so this
          is the only reliable way the tool knows which container to hit.
    required: [query, container]

- name: call_mock_api
  description: >
    Invoke a mock backend endpoint that simulates an external system (e.g.
    dispatch board, technician roster). Returns a JSON object.
  strict: false
  parameters:
    type: object
    properties:
      endpoint:
        type: string
        description: "Endpoint path, e.g. '/technicians/available'."
      params:
        type: object
        description: Optional query parameters as a JSON object.
    required: [endpoint]
