customer:
  name: Alliant
  slug: alliant
  industry: Insurance brokerage and risk management
  website: https://alliant.com/

branding:
  agent_name: AlliantRiskIQ
  primary_color: "#0B2340"
  accent_color: "#2563EB"
  font_family: "Segoe UI, system-ui, sans-serif"
  logo_url: ""
  welcome_message: "Hi, I'm here to help you assess risk, review coverage, and stay ahead of loss exposures."

use_case:
  title: Risk Management Advisor
  description: >
    Alliant risk managers and account teams need fast, reliable answers about client risk profiles,
    loss control recommendations, and program performance. This assistant lets them ask
    natural-language questions and get instant, cited guidance to support renewal strategy and
    loss prevention.

deployment:
  environment_name: alliant-prototype
  resource_group: rg-alliant-prototype
  azure_region: eastus2
  database_name: alliant-db

agents:
  - name: RiskAssessmentAgent
    role: Analyzes client risk profiles and loss exposure trends
    model: gpt-4o
    routing_keywords: [risk, exposure, assessment]
    tools: [search_tool, sql_tool]
    skills:
      - name: risk_scoring
        description: Score and summarize client risk profiles.
    system_prompt_focus: >
      Help risk managers understand a client's current risk profile, exposure trends, and how it
      compares to industry benchmarks, citing source documents and data where relevant.
    response_format: [bulleted, cite_sources]

  - name: LossControlAgent
    role: Recommends loss control and mitigation strategies
    model: gpt-4o-mini
    routing_keywords: [loss control, mitigation, safety]
    tools: [search_tool]
    skills:
      - name: loss_control_guidance
        description: Suggest loss prevention and mitigation actions.
    system_prompt_focus: >
      Provide practical, prioritized loss control recommendations based on the client's risk
      profile and known industry best practices.
    response_format: [bulleted, cite_sources]

  - name: PolicyProgramAgent
    role: Explains coverage programs, policy structures, and limits
    model: gpt-4o
    routing_keywords: [policy, coverage, program]
    tools: [search_tool, sql_tool]
    skills:
      - name: coverage_lookup
        description: Explain policy coverage, limits, and exclusions.
    system_prompt_focus: >
      Answer questions about coverage programs, limits, exclusions, and structure clearly, citing
      the relevant policy documents.
    response_format: [bulleted, cite_sources]

tables:
  - name: clients
    partition_key: /clientId
    seed_count: 250
    seed_scenario: Mid-to-large commercial clients across construction, real estate, healthcare, and public entity sectors.
    description: Client accounts managed by Alliant risk advisors.
    columns:
      - { name: id, type: string }
      - { name: clientId, type: string }
      - { name: clientName, type: string }
      - { name: industry, type: string }
      - { name: riskScore, type: number }
      - { name: region, type: string }

  - name: risk_assessments
    partition_key: /clientId
    seed_count: 300
    seed_scenario: Periodic risk assessments tied to client accounts with severity and category.
    description: Risk assessment records for client accounts.
    columns:
      - { name: id, type: string }
      - { name: clientId, type: string }
      - { name: assessmentDate, type: date }
      - { name: riskCategory, type: string }
      - { name: severity, type: string }

  - name: loss_control_recommendations
    partition_key: /clientId
    seed_count: 200
    seed_scenario: Open and closed loss control recommendations with due dates and status.
    description: Loss control and mitigation recommendations per client.
    columns:
      - { name: id, type: string }
      - { name: clientId, type: string }
      - { name: recommendationType, type: string }
      - { name: status, type: string }
      - { name: dueDate, type: date }

documents:
  - title: Risk Management Playbook
    description: Best practices for loss control and risk mitigation across industries.
    key_topics: [loss control, safety programs, risk mitigation]

  - title: Property and Casualty Coverage Guide
    description: Explains standard coverage structures, limits, and exclusions.
    key_topics: [coverage limits, exclusions, endorsements]

  - title: Industry Risk Benchmarks
    description: Benchmarking data and claims trends by industry.
    key_topics: [benchmarking, industry risk, claims trends]

starter_questions:
  - What is the risk score for our top client?
  - What loss control recommendations are overdue?
  - Summarize coverage gaps for a client.
  - Show recent risk assessment trends.

demo_persona:
  name: Jordan Lee
  role: Senior Risk Manager

foundry_iq:
  index_name: alliant-knowledge

model_deployments:
  - deployment_name: gpt-4o
    model: gpt-4o
    version: "2024-11-20"
    sku: GlobalStandard
    capacity: 30
  - deployment_name: gpt-4o-mini
    model: gpt-4o-mini
    version: "2024-07-18"
    sku: GlobalStandard
    capacity: 30
  - deployment_name: text-embedding-3-large
    model: text-embedding-3-large
    version: "1"
    sku: Standard
    capacity: 30

mock_api:
  enabled: false
  endpoints: []
